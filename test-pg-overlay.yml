# Test overlay: override web server port + disable JSONL + enable PG backend.
# This is a development overlay for running a second instance alongside the
# production web profile.  The PG backend + console registration is now
# handled by the bundle's cordis.patch.yml (auto-loaded when the package is
# listed in dsh.profile.bundles).  This overlay only overrides the port.
#
# Usage:
#   dsh --profile web --patch test-pg-overlay.yml   # boot test instance on 3081

- id: webserver
  config:
    host: 0.0.0.0
    port: 3081